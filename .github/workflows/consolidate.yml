name: Consolidate 1623 and 1609 files

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

jobs:
    run-script:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Run the consolidation script
              id: run_consolidation
              run: python scripts/automate_variation.py
            - name: Run the semicolon script
              id: run_semicolon
              if: steps.run_consolidation.outcome == 'success'
              run: python scripts/add_seg_semicolon.py
            - name: reformat-xml
              uses: tomschr/xml-format-action@v1
              with:
                repo-token: ${{ secrets.GITHUB_TOKEN }}
                commit: false
            - name: Save and commit results
              uses: stefanzweifel/git-auto-commit-action@v5
              with:
                commit_message: Created consolidated file based on latest changes